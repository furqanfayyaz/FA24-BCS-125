<!DOCTYPE html>
<html lang="en">
<head>
    <!--
      Name: Furqan Fayyaz
      Reg Number: FA24-BCS-125
      Purpose: CUI Library Membership Application Form (Lab Assignment 1)
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CUI Library Portal - Membership Application</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Library Membership Application Form</h1>
        <p>Register for full borrowing privileges and digital repository access</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="departments.html">Departments</a>
        <a href="admission.html">Admission & Fees</a>
        <a href="app.html">Membership Form</a>
        <a href="https://www.comsats.edu.pk" target="_blank">CUI Main</a>
    </nav>

    <main>
        <section>
            <form action="#" method="post">
                <fieldset>
                    <legend>Personal & Academic Information</legend>

                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required minlength="3" placeholder="Enter your full name">

                    <label for="regno">Registration Number:</label>
                    <input type="text" id="regno" name="regno" required pattern="FA[0-9]{2}-[A-Z]{3}-[0-9]{3}" placeholder="e.g. FA24-BCS-125" value="FA24-BCS-125">

                    <label for="email">Student Email:</label>
                    <input type="email" id="email" name="email" required placeholder="student@student.cu.edu.pk">

                    <label for="password">Portal Password:</label>
                    <input type="password" id="password" name="password" required minlength="6" placeholder="At least 6 characters">

                    <label for="dob">Date of Birth:</label>
                    <input type="date" id="dob" name="dob" required>

                    <label>Gender:</label>
                    <div style="margin-bottom: 1rem;">
                        <input type="radio" id="male" name="gender" value="male" checked>
                        <label for="male" style="display:inline; margin-right: 15px;">Male</label>
                        <input type="radio" id="female" name="gender" value="female">
                        <label for="female" style="display:inline;">Female</label>
                    </div>

                    <label for="department">Select Department:</label>
                    <select id="department" name="department" required>
                        <optgroup label="Computing & IT">
                            <option value="cs">Computer Science</option>
                            <option value="se">Software Engineering</option>
                            <option value="ai">Artificial Intelligence</option>
                        </optgroup>
                        <optgroup label="Engineering">
                            <option value="ee">Electrical Engineering</option>
                        </optgroup>
                    </select>
                </fieldset>

                <fieldset>
                    <legend>Library Preferences & Uploads</legend>

                    <label>Research Interests:</label>
                    <div style="margin-bottom: 1rem;">
                        <input type="checkbox" id="interest1" name="interests" value="ai">
                        <label for="interest1" style="display:inline; margin-right: 15px;">Artificial Intelligence</label>
                        <input type="checkbox" id="interest2" name="interests" value="web">
                        <label for="interest2" style="display:inline; margin-right: 15px;">Web Technologies</label>
                        <input type="checkbox" id="interest3" name="interests" value="networks">
                        <label for="interest3" style="display:inline;">Cyber Security</label>
                    </div>

                    <label for="books">Requested Books Count (1-5):</label>
                    <input type="number" id="books" name="books" min="1" max="5" value="2">

                    <label for="photo">Profile Photo Upload:</label>
                    <input type="file" id="photo" name="photo" accept="image/*" required>

                    <label for="comments">Additional Notes / Comments:</label>
                    <textarea id="comments" name="comments" rows="4" placeholder="Mention any specific research focus..."></textarea>
                </fieldset>

                <div style="text-align: center;">
                    <button type="submit">Submit Application</button>
                    <button type="reset" style="background-color: #d32f2f; margin-left: 10px;">Reset Form</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 CUI Library Portal | Developed by Furqan Fayyaz (FA24-BCS-125)</p>
    </footer>
</body>
</html>
